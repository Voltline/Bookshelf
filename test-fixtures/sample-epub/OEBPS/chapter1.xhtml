<h1>第一章 开始阅读</h1>
<p>这是一本用于验证导入、分页和文字朗读功能的测试书。当前段落应该出现在阅读器的第一页。</p>
<p>阅读器会根据手机屏幕的实际宽度和高度自动计算每一页能够显示的文字数量，而不是使用固定字符数。</p>
<p>你可以点击下一页按钮，也可以在正文区域向左滑动。向右滑动则会返回上一页。</p>
<p>点击朗读本页以后，系统文字转语音引擎会开始发声。当这一页朗读结束，应用会自动切换并继续朗读下一页。</p>
<p>为了确保测试书可以产生多个页面，这里继续补充一些正文。窗外的风经过树梢，书页上的句子安静地向前延伸。</p>
<p>每一次翻页都会保存阅读进度。返回书架后再次进入本书，阅读器应当恢复到上次停留的位置。</p>
</body>
</html>
