<h1>第二章 自动翻页</h1>
<p>如果你是通过连续朗读来到这里，说明自动翻页链路已经正常工作。</p>
<p>应用会把超过系统单次输入限制的页面拆分成多个语音片段，只有最后一个片段完成以后才会翻页。</p>
<p>手动翻页时，如果朗读仍在进行，旧页面的语音会立即停止，随后从新页面开头继续朗读。</p>
<p>到达全书最后一页以后，应用会停止朗读并显示完成提示，不会继续请求不存在的页面。</p>
<p>测试正文到这里结束。你可以返回书架检查阅读进度，也可以重新打开应用确认书籍仍然存在。</p>
</body>
</html>
